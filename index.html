<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YT</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
var v = (new URLSearchParams(location.search).get("v") || "").replace(/[^A-Za-z0-9_-]/g, "");
if (v) {
  var f = document.createElement("iframe");
  f.src = "https://www.youtube.com/embed/" + v + "?autoplay=1&playsinline=1&rel=0";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(f);
}
</script>
</body>
</html>
